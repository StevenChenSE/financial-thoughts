---
layout: default
---

<article class="article-detail">
  <a href="{{ site.baseurl }}/" class="back-link">← Back to Articles</a>
  
  {% if page.video_url %}
  <div class="video-link" style="margin-bottom: 20px; padding: 12px 16px; background: #f0f5ff; border-radius: 8px; border-left: 4px solid #1890ff;">
    <a href="https://www.youtube.com/watch?v={{ page.video_url }}" target="_blank" style="color: #1890ff; text-decoration: none; font-weight: 500;">
      🎬 source video
    </a>
  </div>
  {% endif %}
  
  <h1>{{ page.title }}</h1>
  <div class="meta">
    {{ page.date | date: "%B %d, %Y" }} · {{ page.category }} · {{ page.word_count }} words
  </div>
  <div class="content markdown-body">
    {{ content }}
  </div>
</article>
