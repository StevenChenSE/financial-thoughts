---
layout: default
---

<article class="article-detail">
  <a href="{{ site.baseurl }}/" class="back-link">← Back to Articles</a>
  <h1>{{ page.title }}</h1>
  <div class="meta">
    {{ page.date | date: "%B %d, %Y" }} · {{ page.category }}
  </div>
  <div class="content markdown-body">
    {{ content }}
  </div>
</article>
