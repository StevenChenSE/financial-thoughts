<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: 'Financial Thoughts' }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown.min.css">
  <style>
    :root {
      --bg-primary: #fafbfc;
      --bg-secondary: #ffffff;
      --bg-tertiary: #f0f2f5;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-tertiary: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-light: #eff6ff;
      --accent-glow: rgba(37, 99, 235, 0.15);
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --header-bg: rgba(255, 255, 255, 0.8);
      --header-border: rgba(226, 232, 240, 0.6);
      --footer-bg: #0f172a;
      --footer-text: #94a3b8;
      --code-bg: #f1f5f9;
      --gradient-hero: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #1e40af 100%);
      --gradient-accent: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
      --category-finance: #2563eb;
      --category-finance-bg: #eff6ff;
      --category-investing: #059669;
      --category-investing-bg: #ecfdf5;
      --category-economy: #d97706;
      --category-economy-bg: #fffbeb;
      --category-crypto: #7c3aed;
      --category-crypto-bg: #f5f3ff;
      --category-default: #64748b;
      --category-default-bg: #f1f5f9;
    }

    [data-theme="dark"] {
      --bg-primary: #0b1120;
      --bg-secondary: #111827;
      --bg-tertiary: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-tertiary: #64748b;
      --accent: #3b82f6;
      --accent-hover: #60a5fa;
      --accent-light: #1e3a5f;
      --accent-glow: rgba(59, 130, 246, 0.2);
      --border: #1e293b;
      --border-hover: #334155;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      --header-bg: rgba(11, 17, 32, 0.85);
      --header-border: rgba(30, 41, 59, 0.6);
      --footer-bg: #050a15;
      --footer-text: #64748b;
      --code-bg: #1e293b;
      --gradient-hero: linear-gradient(135deg, #050a15 0%, #0f172a 50%, #1e293b 100%);
      --category-finance-bg: #1e3a5f;
      --category-investing-bg: #064e3b;
      --category-economy-bg: #78350f;
      --category-crypto-bg: #4c1d95;
      --category-default-bg: #1e293b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    ::selection {
      background: var(--accent);
      color: #fff;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

    /* ── Reading Progress Bar ── */
    .progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 0%;
      height: 3px;
      background: var(--gradient-accent);
      z-index: 1000;
      transition: width 0.1s ease;
    }

    /* ── Header ── */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--header-border);
      transition: all 0.3s ease;
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text-primary);
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: var(--gradient-accent);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      font-family: 'Playfair Display', serif;
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .nav { display: flex; align-items: center; gap: 8px; }

    .nav-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      transition: all 0.2s ease;
    }

    .nav-link:hover {
      color: var(--text-primary);
      background: var(--bg-tertiary);
    }

    .nav-link.active {
      color: var(--accent);
      background: var(--accent-light);
    }

    .theme-toggle {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      margin-left: 8px;
    }

    .theme-toggle:hover {
      background: var(--border);
      color: var(--text-primary);
      transform: scale(1.05);
    }

    /* ── Main Content ── */
    .main-content {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 24px 64px;
    }

    /* ── Hero Section ── */
    .hero-section {
      background: var(--gradient-hero);
      border-radius: var(--radius-xl);
      padding: 64px 48px;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
    }

    .hero-section::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.3) 0%, transparent 70%);
      border-radius: 50%;
    }

    .hero-section::after {
      content: '';
      position: absolute;
      bottom: -30%;
      left: -10%;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(124, 58, 237, 0.2) 0%, transparent 70%);
      border-radius: 50%;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 680px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 24px;
    }

    .hero-badge-dot {
      width: 6px;
      height: 6px;
      background: #34d399;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: 48px;
      font-weight: 800;
      color: #fff;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 16px;
    }

    .hero-subtitle {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.7;
      margin-bottom: 32px;
      max-width: 540px;
    }

    .hero-stats {
      display: flex;
      gap: 32px;
    }

    .hero-stat {
      display: flex;
      flex-direction: column;
    }

    .hero-stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
    }

    .hero-stat-label {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 500;
    }

    /* ── Section Header ── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .section-filter {
      display: flex;
      gap: 6px;
    }

    .filter-btn {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ── Article Grid ── */
    .article-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .article-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .article-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gradient-accent);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .article-card:hover {
      border-color: var(--border-hover);
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .article-card:hover::before {
      opacity: 1;
    }

    .article-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .article-category {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 4px 10px;
      border-radius: 100px;
    }

    .category-finance { color: var(--category-finance); background: var(--category-finance-bg); }
    .category-investing { color: var(--category-investing); background: var(--category-investing-bg); }
    .category-economy { color: var(--category-economy); background: var(--category-economy-bg); }
    .category-crypto { color: var(--category-crypto); background: var(--category-crypto-bg); }
    .category-default { color: var(--category-default); background: var(--category-default-bg); }

    .article-video-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--text-tertiary);
      font-weight: 500;
    }

    .article-title {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
      color: var(--text-primary);
      margin-bottom: 10px;
      letter-spacing: -0.01em;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .article-excerpt {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 18px;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .article-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-tertiary);
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .article-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ── Featured Article ── */
    .featured-card {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      padding: 32px;
    }

    .featured-card .article-title {
      font-size: 26px;
      -webkit-line-clamp: 4;
    }

    .featured-card .article-excerpt {
      -webkit-line-clamp: 4;
    }

    .featured-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 12px;
    }

    /* ── Pagination ── */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
    }

    .page-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px;
      height: 40px;
      padding: 0 14px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .page-link:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-light);
    }

    .page-link.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .page-link.nav-link-btn {
      font-weight: 600;
    }

    /* ── Article Detail ── */
    .article-detail {
      max-width: 780px;
      margin: 0 auto;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 8px 0;
      margin-bottom: 24px;
      transition: color 0.2s ease;
    }

    .back-link:hover { color: var(--accent); }

    .article-header {
      margin-bottom: 32px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }

    .article-header .article-category {
      margin-bottom: 16px;
      display: inline-block;
    }

    .article-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 40px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.03em;
      color: var(--text-primary);
      margin-bottom: 20px;
    }

    .article-header-meta {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 14px;
      color: var(--text-tertiary);
    }

    .meta-separator {
      width: 4px;
      height: 4px;
      background: var(--text-tertiary);
      border-radius: 50%;
    }

    /* ── Video Link Card ── */
    .video-link-card {
      background: var(--accent-light);
      border: 1px solid var(--accent);
      border-radius: var(--radius-md);
      padding: 20px 24px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.2s ease;
    }

    .video-link-card:hover {
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .video-icon {
      width: 48px;
      height: 48px;
      background: var(--accent);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .video-icon svg {
      width: 24px;
      height: 24px;
      fill: #fff;
    }

    .video-info { flex: 1; }

    .video-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .video-link:hover { text-decoration: underline; }

    .video-meta {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* ── Content / Markdown ── */
    .article-content {
      font-size: 17px;
      line-height: 1.8;
      color: var(--text-primary);
    }

    .article-content h2 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      margin: 48px 0 20px;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .article-content h3 {
      font-size: 22px;
      font-weight: 600;
      margin: 36px 0 16px;
      color: var(--text-primary);
    }

    .article-content p { margin-bottom: 20px; }

    .article-content a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }

    .article-content a:hover {
      border-bottom-color: var(--accent);
    }

    .article-content strong { font-weight: 600; }

    .article-content ul, .article-content ol {
      margin-bottom: 20px;
      padding-left: 24px;
    }

    .article-content li { margin-bottom: 8px; }

    .article-content blockquote {
      border-left: 4px solid var(--accent);
      padding: 16px 24px;
      margin: 24px 0;
      background: var(--bg-tertiary);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: var(--text-secondary);
      font-style: italic;
    }

    .article-content code {
      background: var(--code-bg);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.9em;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    .article-content pre {
      background: var(--code-bg);
      padding: 20px;
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .article-content pre code {
      background: none;
      padding: 0;
    }

    .article-content img {
      max-width: 100%;
      border-radius: var(--radius-md);
      margin: 24px 0;
    }

    .article-content table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 24px;
    }

    .article-content th,
    .article-content td {
      border: 1px solid var(--border);
      padding: 12px 16px;
      text-align: left;
    }

    .article-content th {
      background: var(--bg-tertiary);
      font-weight: 600;
    }

    .article-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 32px 0;
    }

    /* ── Footer ── */
    .footer {
      background: var(--footer-bg);
      padding: 48px 24px;
      margin-top: 80px;
    }

    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-brand {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer-logo {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
    }

    .footer-copy {
      font-size: 14px;
      color: var(--footer-text);
    }

    .footer-links {
      display: flex;
      gap: 24px;
    }

    .footer-links a {
      color: var(--footer-text);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s ease;
    }

    .footer-links a:hover { color: #fff; }

    /* ── Animations ── */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-in {
      animation: fadeInUp 0.5s ease forwards;
    }

    .article-card { animation: fadeInUp 0.5s ease forwards; }
    .article-card:nth-child(1) { animation-delay: 0.05s; }
    .article-card:nth-child(2) { animation-delay: 0.1s; }
    .article-card:nth-child(3) { animation-delay: 0.15s; }
    .article-card:nth-child(4) { animation-delay: 0.2s; }
    .article-card:nth-child(5) { animation-delay: 0.25s; }
    .article-card:nth-child(6) { animation-delay: 0.3s; }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .header-inner { padding: 0 16px; height: 56px; }
      .logo-text { font-size: 17px; }
      .nav-link { padding: 6px 10px; font-size: 13px; }
      .main-content { padding: 20px 16px 48px; }
      .hero-section { padding: 40px 24px; border-radius: var(--radius-lg); }
      .hero-title { font-size: 32px; }
      .hero-subtitle { font-size: 16px; }
      .hero-stats { gap: 24px; }
      .hero-stat-value { font-size: 24px; }
      .article-grid { grid-template-columns: 1fr; gap: 16px; }
      .featured-card { grid-template-columns: 1fr; gap: 20px; padding: 24px; }
      .featured-card .article-title { font-size: 22px; }
      .section-header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .section-title { font-size: 24px; }
      .article-header h1 { font-size: 28px; }
      .article-content { font-size: 16px; }
      .article-content h2 { font-size: 24px; }
      .footer-inner { flex-direction: column; gap: 24px; text-align: center; }
      .video-link-card { flex-direction: column; text-align: center; }
    }

    @media (max-width: 480px) {
      .hero-stats { flex-direction: column; gap: 16px; }
      .section-filter { flex-wrap: wrap; }
      .article-header-meta { flex-direction: column; align-items: flex-start; gap: 8px; }
      .meta-separator { display: none; }
    }
  </style>
</head>
<body>
  <div class="progress-bar" id="progressBar"></div>

  <header class="header">
    <div class="header-inner">
      <a href="{{ site.baseurl }}/" class="logo">
        <div class="logo-icon">F</div>
        <span class="logo-text">Financial Thoughts</span>
      </a>
      <nav class="nav">
        <a href="{{ site.baseurl }}/" class="nav-link{% if page.url == '/' %} active{% endif %}">Home</a>
        <a href="{{ site.baseurl }}/#articles" class="nav-link">Articles</a>
        <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn" aria-label="Toggle theme">
          <span id="themeIcon">🌙</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="main-content">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="footer-logo">Financial Thoughts</span>
        <span class="footer-copy">© 2026 Financial Thoughts. All rights reserved.</span>
      </div>
      <div class="footer-links">
        <a href="{{ site.baseurl }}/">Home</a>
        <a href="{{ site.baseurl }}/#articles">Articles</a>
      </div>
    </div>
  </footer>

  <script>
    // Theme management
    function getTheme() {
      return localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const icon = document.getElementById('themeIcon');
      if (icon) icon.textContent = theme === 'dark' ? '☀️' : '🌙';
      localStorage.setItem('theme', theme);
    }

    function toggleTheme() {
      applyTheme(getTheme() === 'dark' ? 'light' : 'dark');
    }

    applyTheme(getTheme());

    // Reading progress bar
    window.addEventListener('scroll', () => {
      const bar = document.getElementById('progressBar');
      if (!bar) return;
      const scrollTop = window.scrollY;
      const docHeight = document.documentElement.scrollHeight - window.innerHeight;
      const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      bar.style.width = progress + '%';
    });
  </script>
</body>
</html>
