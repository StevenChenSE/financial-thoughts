---
layout: default
---

<div class="hero-section">
  <h1 class="hero-title">Financial Thoughts</h1>
  <p class="hero-subtitle">Insights and perspectives on personal finance, investing, and wealth building</p>
</div>

<div class="articles-section" id="articles">
  <h2 class="section-title">Latest Articles</h2>
  <div class="article-list">
    {% for post in site.posts %}
      <a href="{{ site.baseurl }}{{ post.url }}" class="article-card">
        <h3 class="article-title">{{ post.title }}</h3>
        <p class="article-excerpt">{{ post.excerpt }}</p>
        <div class="article-meta">
          <span>{{ post.date | date: "%b %d, %Y" }}</span>
          <span>{{ post.category }}</span>
        </div>
      </a>
    {% endfor %}
  </div>
</div>
